<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Content Studio | Multi-Platform Reels & Social{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">
  <nav class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-lg bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-purple-500/20">
          <i class="fa-solid fa-bolt text-white text-lg"></i>
        </div>
        <div>
          <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">ContentStudio</span>
          <span class="ml-2 text-xs uppercase px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 font-semibold border border-indigo-500/20">SaaS One-Click</span>
        </div>
      </div>
      <div class="flex items-center gap-4">
        {% if session.get('user_id') %}
          <div class="text-xs text-slate-400 flex items-center gap-2">
            <span class="h-2 w-2 rounded-full bg-emerald-400"></span>
            <span>{{ user_email }}</span>
          </div>
          <a href="{{ url_for('auth.logout') }}" class="text-xs text-slate-400 hover:text-rose-400 transition-colors px-3 py-1.5 rounded-lg border border-slate-800 hover:border-rose-500/30">
            <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> Logout
          </a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="flex-1 w-full max-w-7xl mx-auto p-4 sm:p-6 flex flex-col">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="space-y-2 mb-4">
          {% for category, msg in messages %}
            <div class="p-3.5 rounded-xl text-sm flex items-center justify-between border {% if category == 'danger' %}bg-rose-500/10 text-rose-300 border-rose-500/30{% elif category == 'success' %}bg-emerald-500/10 text-emerald-300 border-emerald-500/30{% else %}bg-indigo-500/10 text-indigo-300 border-indigo-500/30{% endif %}">
              <span>{{ msg }}</span>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
